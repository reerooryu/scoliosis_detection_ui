# Runs the tests on every push and pull request. Only Python, pytest, numpy,
# pydicom and requests are needed: the tests cover the math, post-processing,
# DICOM conversion, project files and updates, not the model or the UI.
# Windows and Mac are included for the self-update swap (tests/test_updater.py),
# which works differently on each.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.12" }
          - { os: macos-14, python-version: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pytest numpy pydicom requests
      - run: pytest -v
